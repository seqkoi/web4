<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | Paws &amp; Hearts</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">Paws &amp; Hearts</a>
  <nav aria-label="Main">
    <a href="index.html">Home</a>
    <a href="signup.html" aria-current="page">Sign up</a>
  </nav>
</header>

<main>
  <section class="panel narrow">
    <h1 class="page-title">Become a volunteer</h1>
    <p class="muted">Sign up to help animals at our shelter. We will contact you to plan your first shift.</p>
    <form id="signupForm" novalidate>
      <label for="fullName">Full name</label>
      <input id="fullName" name="fullName" type="text" autocomplete="name">
      <p class="error" id="fullNameError"></p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <p class="error" id="emailError"></p>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password">
      <p class="hint">At least 8 characters, with a letter and a number.</p>
      <p class="error" id="passwordError"></p>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password">
      <p class="error" id="confirmPasswordError"></p>

      <label class="check"><input id="terms" name="terms" type="checkbox"> I agree to the volunteer guidelines</label>
      <p class="error" id="termsError"></p>

      <button type="submit">Join as volunteer</button>
    </form>
    <p id="formSuccess" class="success" role="status"></p>
  </section>
</main>

<footer class="footer">
  <p>Paws &amp; Hearts Animal Shelter</p>
  <p class="muted">Team Nuradok: Nurzaman, Adilzhan</p>
</footer>

<script src="js/validate.js"></script>
</body>
</html>
